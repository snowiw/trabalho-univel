<svg viewBox="0 0 450 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="450" height="340" rx="10" fill="#1a1a1a"/>

  <!-- ruas -->
  <g stroke="#3a3a3a" stroke-width="8">
    <line x1="0" y1="80" x2="450" y2="80"/>
    <line x1="0" y1="200" x2="450" y2="200"/>
    <line x1="110" y1="0" x2="110" y2="340"/>
    <line x1="320" y1="0" x2="320" y2="340"/>
  </g>

  <!-- quadras -->
  <g fill="#2b2b2b">
    <rect x="20" y="15" width="70" height="45"/>
    <rect x="340" y="15" width="90" height="45"/>
    <rect x="20" y="250" width="70" height="70"/>
    <rect x="350" y="240" width="80" height="80"/>
  </g>

  <!-- patio do evento -->
  <rect x="150" y="110" width="150" height="110" rx="6" fill="#444444"/>

  <!-- marcador do local -->
  <circle cx="225" cy="160" r="14" fill="#d62828"/>
  <circle cx="225" cy="160" r="6" fill="#ffffff"/>
</svg>
